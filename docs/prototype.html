*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);font-weight:600;text-wrap:balance;margin:0;letter-spacing:-.01em}

.appt{display:grid;grid-template-columns:70px minmax(0,1fr) auto;gap:12px;padding:8px 0;border-bottom:1px dashed var(--line);align-items:start}

.note{padding:10px 12px;border-radius:var(--r);font-size:13px;background:var(--sunk)}

  .kv{grid-template-columns:1fr}
  .kv dt{margin-top:6px}

@media (prefers-reduced-motion:no-preference){.btn,.navlist button{transition:background .15s,border-color .15s}}

function invTotals(inv){
  const sub = inv.lines.reduce((s,l) => s + l.qty*l.pu, 0);
  const taxable = inv.lines.filter(l => l.type !== 'Débours').reduce((s,l) => s + l.qty*l.pu, 0);
  const tax = inv.tva ? r2(taxable*0.16) : 0;
  const total = r2(sub + tax);
  const paid = r2(S.moves.filter(m => m.type === 'in' && m.invoiceId === inv.id && m.status === 'ok').reduce((s,m) => s + m.amountInv, 0));
  return { sub, tax, total, paid, rest: Math.max(0, r2(total - paid)) };
}
function invStatus(inv){
  if (inv.status === 'brouillon') return 'Brouillon';
  if (inv.status === 'annulée') return 'Annulée';
  const t = invTotals(inv);
  if (t.rest < 0.01) return 'Payée';
  if (inv.due < T) return t.paid > 0 ? 'Partielle, échue' : 'Échue';
  return t.paid > 0 ? 'Partiellement payée' : 'Émise';
}

const cashAcct = (mode,cur) => mode === 'Espèces' ? (cur === 'USD' ? '5711' : '5712') : mode === 'Mobile money' ? '5216' : '521';
function balances(upto){
  const b = { USD:S.cash.init.USD, CDF:S.cash.init.CDF, bank:0, momo:0 };
  S.moves.forEach(m => {
    if (m.status !== 'ok') return;
    if (upto && m.date >= upto) return;
    if (m.type === 'fx'){ b[m.cur] -= m.amount; b[m.to] += m.amountTo; return; }
    const sign = m.type === 'in' ? 1 : m.type === 'out' ? -1 : 1;
    if (m.mode === 'Espèces') b[m.cur] += sign*m.amount;
    else if (m.mode === 'Mobile money') b.momo += sign*toUSD(m.amount,m.cur,m.rate);
    else b.bank += sign*toUSD(m.amount,m.cur,m.rate);
  });
  return b;
}

function entries(){
  const E = [];
  const add = (date,jnl,piece,lib,lines) => E.push({date, jnl, piece, lib, lines: lines.filter(l => Math.abs(l[1]) > 0.004 || Math.abs(l[2]) > 0.004).map(l => [l[0], r2(l[1]), r2(l[2])])});

  add(S.cash.since,'OD','AN','Soldes d\'ouverture de caisse',[['5711',iu,0],['5712',ic,0],['12',0,iu+ic]]);
  S.invoices.forEach(i => {
    if (!i.num) return;
    const t = invTotals(i), f = a => toUSD(a, i.cur, i.rate);
    add(i.date,'VT',i.num,'Facture ' + cname(i.clientId),[['411',f(t.total),0],['706',0,f(t.sub)],['4431',0,f(t.tax)]]);
    if (i.status === 'annulée') add(i.cancelDate,'VT','AV-' + i.num.slice(4),'Avoir sur ' + i.num,[['706',f(t.sub),0],['4431',f(t.tax),0],['411',0,f(t.total)]]);
  });
  S.moves.forEach(m => {
    if (m.status !== 'ok') return;
    const u = toUSD(m.amount, m.cur, m.rate), a = cashAcct(m.mode, m.cur), d = m.date.slice(0,10);
    if (m.type === 'in') add(d, m.mode === 'Espèces' ? 'CA' : 'BQ', m.receipt || '', m.label, [[a,u,0],[m.invoiceId ? '411' : '4191',0,u]]);
    else if (m.type === 'out'){ const acc = (CATS.find(c => c[0] === m.cat) || CATS[7])[1]; add(d, m.mode === 'Espèces' ? 'CA' : 'BQ', m.piece || '', m.label, [[acc,u,0],[a,0,u]]); }
    else if (m.type === 'fx') add(d,'CA','CHG',m.label,[[cashAcct('Espèces',m.to),u,0],[a,0,u]]);
    else if (m.type === 'adj') add(d,'CA','ECART',m.label, m.amount > 0 ? [[a,u,0],['758',0,u]] : [['658',-u,0],[a,0,-u]]);
  });
  return E.sort((x,y) => x.date.localeCompare(y.date));
}

function conflictMatches(name){

  </div>`, { submit:'Clôturer', onsubmit:f => {

    if ((ec.USD || ec.CDF) && !f.motif.trim()) return 'Un écart est constaté : indiquez son motif pour clôturer.';
    ['USD','CDF'].forEach(c => { if (ec[c]) S.moves.push({id:nid('m'), date:nowIso(), type:'adj', cur:c, amount:ec[c], rate:rateNow(), mode:'Espèces', label:'Écart de clôture : ' + f.motif.trim(), status:'ok', by:S.me}); });
    S.closedSessions.unshift({closedAt:nowIso(), by:S.me, count:cnt, ecart:ec, motif:f.motif.trim()});
    S.session.open = false;

function openCash(){

  { submit:'Ouvrir', onsubmit:f => {

}

/* ---------- comptabilité ---------- */
function vCompta(){
  const E = entries();
  const tabs = {journal:'Journal', balance:'Balance', resultat:'Résultat'};
  let body = '';
  if (ui.comptaTab === 'journal'){
    let tD = 0, tC = 0;
    body = `<div class="tablewrap"><table><thead><tr><th>Date</th><th>Jnl</th><th>Pièce</th><th>Compte</th><th>Libellé</th><th class="num">Débit $</th><th class="num">Crédit $</th></tr></thead><tbody>
    ${E.map(e => e.lines.map((l,k) => { tD += l[1]; tC += l[2]; return `<tr${k === 0 ? ' style="border-top:2px solid var(--line)"' : ''}><td class="mono">${k === 0 ? fdate(e.date) : ''}</td><td class="mono">${k === 0 ? e.jnl : ''}</td><td class="mono">${k === 0 ? esc(e.piece) : ''}</td><td class="mono">${l[0]}</td><td>${k === 0 ? esc(e.lib) : `<span class="muted">${esc(ACC[l[0]] || '')}</span>`}</td><td class="num">${l[1] ? num(l[1]) : ''}</td><td class="num">${l[2] ? num(l[2]) : ''}</td></tr>`; }).join('')).join('')}
    </tbody><tfoot><tr><td colspan="5">Totaux</td><td class="num">${num(tD)}</td><td class="num">${num(tC)}</td></tr></tfoot></table></div>`;
  } else {
    const agg = {};
    E.forEach(e => e.lines.forEach(l => { agg[l[0]] = agg[l[0]] || {d:0,c:0}; agg[l[0]].d += l[1]; agg[l[0]].c += l[2]; }));
    const keys = Object.keys(agg).sort();
    if (ui.comptaTab === 'balance'){
      let D = 0, C = 0, SD = 0, SC = 0;
      body = `<div class="tablewrap"><table><thead><tr><th>Compte</th><th>Intitulé</th><th class="num">Débit</th><th class="num">Crédit</th><th class="num">Solde débiteur</th><th class="num">Solde créditeur</th></tr></thead><tbody>
      ${keys.map(k => { const a = agg[k], s = a.d - a.c; D += a.d; C += a.c; if (s > 0) SD += s; else SC -= s; return `<tr><td class="mono">${k}</td><td>${esc(ACC[k] || '')}</td><td class="num">${num(a.d)}</td><td class="num">${num(a.c)}</td><td class="num">${s > 0.004 ? num(s) : ''}</td><td class="num">${s < -0.004 ? num(-s) : ''}</td></tr>`; }).join('')}
      </tbody><tfoot><tr><td colspan="2">Totaux</td><td class="num">${num(D)}</td><td class="num">${num(C)}</td><td class="num">${num(SD)}</td><td class="num">${num(SC)}</td></tr></tfoot></table></div>
      <div class="note ${Math.abs(D - C) < 0.05 ? 'good' : 'crit'}" style="margin:12px 16px 16px">${Math.abs(D - C) < 0.05 ? 'La balance est équilibrée : total des débits égal au total des crédits.' : 'Déséquilibre de ' + num(D - C) + ' $ : vérifiez les écritures manuelles.'}</div>`;
    } else {
      const prod = keys.filter(k => k[0] === '7').map(k => [k, agg[k].c - agg[k].d]);
      const ch = keys.filter(k => k[0] === '6').map(k => [k, agg[k].d - agg[k].c]);
      const P = prod.reduce((s,x) => s + x[1], 0), Cg = ch.reduce((s,x) => s + x[1], 0);
      body = `<div class="grid2" style="padding:16px"><div><h3 style="font-size:16px;margin-bottom:6px">Produits</h3><table><tbody>${prod.map(x => `<tr><td class="mono">${x[0]}</td><td>${esc(ACC[x[0]])}</td><td class="num">${num(x[1])}</td></tr>`).join('')}</tbody><tfoot><tr><td colspan="2">Total des produits</td><td class="num">${num(P)}</td></tr></tfoot></table></div>
        <div><h3 style="font-size:16px;margin-bottom:6px">Charges</h3><table><tbody>${ch.map(x => `<tr><td class="mono">${x[0]}</td><td>${esc(ACC[x[0]])}</td><td class="num">${num(x[1])}</td></tr>`).join('')}</tbody><tfoot><tr><td colspan="2">Total des charges</td><td class="num">${num(Cg)}</td></tr></tfoot></table></div></div>
        <div class="note ${P - Cg >= 0 ? 'good' : 'crit'}" style="margin:0 16px 16px">Résultat de la période : <b class="mono">${num(P - Cg)} $</b> (${P - Cg >= 0 ? 'bénéfice' : 'perte'}), hors amortissements et impôts.</div>`;
    }
  }
  return head('Comptabilité', `Écritures générées automatiquement depuis les factures et la caisse · plan inspiré du SYSCOHADA · montants en USD, CDF convertis au taux de chaque opération`) + `
  <div class="tabs" role="tablist">${Object.entries(tabs).map(([k,l]) => `<button role="tab" aria-selected="${ui.comptaTab === k}" data-act="comptaTab" data-t="${k}">${l}</button>`).join('')}</div>
  <section class="panel">${body}</section>`;
}

function sendRecap(){

  const k = t.dataset.change; if (!k) return;
  if (k === 'lawyer'){ ui.agendaLawyer = t.value; render(); }
  else if (k === 'apptStatus'){ const ap = S.appts.find(x => x.id === t.dataset.id), old = ap.status; ap.status = t.value; log('Statut de rendez-vous', `${cname(ap.clientId)} : ${old} → ${t.value}`); if (t.value === 'Annulé'){ const m = sendMail('annulation', client(ap.clientId), apptVars(ap)); toast(m.status === 'Envoyé' ? 'Rendez-vous annulé, client prévenu par e-mail' : 'Rendez-vous annulé. E-mail non envoyé : ' + m.error); } else toast('Statut mis à jour : ' + t.value); render(); }
  else if (k === 'caseStatus'){ const d = caseOf(t.dataset.id); d.status = t.value; log('Statut de dossier', d.ref + ' → ' + t.value); render(); toast('Dossier ' + d.ref + ' : ' + t.value); }
  else if (k === 'setting'){ S.settings[t.dataset.k] = t.value; log('Paramètre modifié', t.dataset.k); render(); }
  else if (k === 'settingNum'){ S.settings[t.dataset.k] = Number(t.value) || 0; log('Paramètre modifié', t.dataset.k); }
  else if (k === 'tva'){ S.settings.tva = t.checked; log('Paramètre modifié', 'TVA ' + (t.checked ? 'activée' : 'désactivée')); }
  else if (k === 'tplS'){ S.templates[t.dataset.k].subject = t.value; toast('Modèle enregistré'); }
  else if (k === 'tplB'){ S.templates[t.dataset.k].body = t.value; toast('Modèle enregistré'); }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.change === 'clientQ'){ ui.clientQ = t.value; const pos = t.selectionStart; render(); const n = $('#f-cq'); n.focus(); n.setSelectionRange(pos,pos); return; }
  if (t.dataset.live && $('#mform')) LIVE[t.dataset.live]($('#mform'));
});
document.addEventListener('submit', e => {
  if (e.target.id !== 'mform') return;
  e.preventDefault();
  const fd = {}; new FormData(e.target).forEach((v,k) => fd[k] = typeof v === 'string' ? v : '');
  const r = onSubmit ? onSubmit(fd, e.target) : undefined;
  if (r === 'chain') return;
  if (typeof r === 'string'){ const el = $('#merr'); el.textContent = r; el.hidden = false; el.scrollIntoView({block:'nearest'}); return; }
  closeModal(); render();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#modal').hidden) closeModal(); });
window.addEventListener('hashchange', () => { const v = location.hash.slice(1); if (VIEWS.some(x => x[0] === v) && v !== ui.view){ ui.view = v; render(); } });

const hv = location.hash.slice(1); if (VIEWS.some(x => x[0] === hv)) ui.view = hv;
render();
</script>
