; Worker de file d'attente LexCabinet (e-mails : rendez-vous, rappels, factures, reçus, dossiers, comptes).
;
; À copier dans /etc/supervisor/conf.d/lexcabinet-worker.conf puis :
;   sudo supervisorctl reread && sudo supervisorctl update && sudo supervisorctl status lexcabinet-worker:*
;
; Adapter les deux valeurs suivantes au VPS :
;   - /var/www/lexcabinet : dossier de l'application (celui qui contient « artisan ») ;
;   - www-data : utilisateur propriétaire de storage/ et bootstrap/cache (le même que PHP-FPM).
; Ce programme a son propre nom (lexcabinet-worker) : il n'affecte aucune autre application du serveur.

[program:lexcabinet-worker]
process_name=%(program_name)s_%(process_num)02d
command=/usr/bin/php /var/www/lexcabinet/artisan queue:work database --sleep=3 --tries=3 --max-time=3600
directory=/var/www/lexcabinet
user=www-data
numprocs=1
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=120
redirect_stderr=true
stdout_logfile=/var/www/lexcabinet/storage/logs/worker.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=3
